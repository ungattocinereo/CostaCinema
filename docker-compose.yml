version: '3.8'

services:
  costiera-cinema:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: costiera-cinema-web
    restart: unless-stopped
    ports:
      # Maps container port 3000 to a random available host port
      # Docker will automatically assign an available port
      - "3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    # Uncomment and configure if using .env file
    # env_file:
    #   - .env.local
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - costiera-network

networks:
  costiera-network:
    driver: bridge
